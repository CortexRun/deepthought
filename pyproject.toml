[project]
name = "deepthought"
version = "0.1.0"
description = "Local RAG assistant on edge hardware: LangGraph + Ollama + pgvector on a Jetson Orin Nano"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ddgs>=9.6.1",
    "fastapi>=0.120.0",
    "langchain>=1.0.2",
    "langchain-community>=0.4",
    "langchain-ollama>=1.0.0",
    "langgraph>=1.0.1",
    "markdown>=3.10",
    "pgvector>=0.4.1",
    "psycopg2>=2.9.11",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pypdf>=6.2.0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "uvicorn[standard]>=0.38.0",
]

[tool.mypy]
mypy_path = "src"
